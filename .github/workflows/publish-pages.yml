name: Publish complete HTML book to GitHub Pages
# Retry publication after repository visibility changed to public.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_full_html.py'
      - 'scripts/build_bilingual_reader.py'
      - 'scripts/translation_gate.py'
      - 'scripts/translation_inventory.py'
      - 'editorial/releases/en-v0.6.json'
      - 'source/current.pdf'
      - 'editorial/source_manifest.json'
      - '.github/workflows/publish-pages.yml'
      - 'requirements.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify all tests
        run: python -m unittest discover -s tests -v
      - name: Build complete HTML edition
        run: python scripts/build_full_html.py
      - name: Add reader navigation and approved English edition
        run: |
          edition=editorial/releases/en-v0.6.json
          if [[ -f "$edition" ]]; then
            python scripts/build_bilingual_reader.py --english-edition "$edition"
          else
            python scripts/build_bilingual_reader.py
          fi
      - name: Validate output and exclude source PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          site = Path("build/full-html")
          data = json.loads((site/"build-manifest.json").read_text())
          assert data["pages"] == 323
          english = Path("editorial/releases/en-v0.6.json").is_file()
          expected = {"index.html", "en/index.html"} if english else {"index.html"}
          assert {path.relative_to(site).as_posix() for path in site.rglob("*.html")} == expected
          assert (site/"index.html").read_text().count('<section class="page"') == 323
          assert (site/"index.html").is_file()
          if english:
              assert (site/"en/index.html").read_text().count('aria-label="Source page ') == 323
          assert not list(site.rglob("*.pdf")), "PDF must not be published"
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/full-html
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" --jq '[.artifacts[] | select(.expired == false)] | length'); then
              if [ "$count" = 1 ]; then
                echo "Pages artifact is visible"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::Pages artifact did not become uniquely visible"
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Verify public document matches generated book
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if curl -fsSL --max-time 60 "https://trucco86.github.io/agentic-sdlc-premium/?v=$GITHUB_SHA" -o /tmp/public-book.html &&
              cmp -s /tmp/public-book.html build/full-html/index.html &&
              { [[ ! -f build/full-html/en/index.html ]] ||
                { curl -fsSL --max-time 60 "https://trucco86.github.io/agentic-sdlc-premium/en/?v=$GITHUB_SHA" -o /tmp/public-book-en.html &&
                  cmp -s /tmp/public-book-en.html build/full-html/en/index.html; }; }; then
              echo "Public HTML matches complete generated book"
              exit 0
            fi
            sleep 10
          done
          echo "::error::Public HTML differs from generated book"
          exit 1
