name: Publish complete HTML book to GitHub Pages
# Retry publication after repository visibility changed to public.
on:
  push:
    branches: [main]
    paths:
      - 'scripts/build_full_html.py'
      - 'source/current.pdf'
      - 'editorial/source_manifest.json'
      - '.github/workflows/publish-pages.yml'
      - 'requirements.txt'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify all tests
        run: python -m unittest discover -s tests -v
      - name: Build complete HTML edition
        run: python scripts/build_full_html.py
      - name: Validate output and exclude source PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          site = Path("build/full-html")
          data = json.loads((site/"build-manifest.json").read_text())
          assert data["pages"] == 323
          assert len(list(site.glob("pagina-*.html"))) == 323
          assert (site/"index.html").is_file()
          assert not list(site.rglob("*.pdf")), "PDF must not be published"
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/full-html
          name: github-pages-${{ github.run_attempt }}
      - name: Wait for Pages artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$ARTIFACT_NAME" --jq '[.artifacts[] | select(.expired == false)] | length'); then
              if [ "$count" = 1 ]; then
                echo "Pages artifact is visible"
                exit 0
              fi
            fi
            sleep 5
          done
          echo "::error::Pages artifact did not become uniquely visible"
          exit 1
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

# Fresh publication run after duplicate artifacts in previous retry.
