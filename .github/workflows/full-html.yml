name: Full HTML book verification
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-full-html:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build complete HTML edition
        run: python scripts/build_full_html.py
      - name: Validate all pages
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          folder = Path("build/full-html")
          manifest = json.loads((folder / "build-manifest.json").read_text())
          assert manifest["pages"] == 323
          assert len(list(folder.glob("*.html"))) == 1
          assert (folder/"index.html").read_text().count('<section class="page"') == 323
          assert not list(folder.glob("*.svg"))
          assert (folder / "index.html").is_file()
          PY
      - name: Upload private HTML preview
        uses: actions/upload-artifact@v4
        with:
          name: complete-html-book-private-preview
          path: build/full-html/
          retention-days: 14
