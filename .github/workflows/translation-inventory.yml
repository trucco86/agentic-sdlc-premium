name: Bilingual editorial preparation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python scripts/translation_inventory.py
      - name: Prepare first translation batch
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.editorial_queue import plan
          folder = Path("build/translation")
          inv = json.loads((folder/"inventory.json").read_text())
          assert len(inv["units"]) == 323
          edition = {"source_sha256":inv["source_sha256"],"language":"en","units":[]}
          seen = set()
          for file in sorted(Path("editorial/translations/en").glob("*.json")):
              record = json.loads(file.read_text(encoding="utf-8"))
              if record.get("source_sha256") != inv["source_sha256"] or record.get("language") != "en":
                  continue
              for unit in record["units"]:
                  if unit["page"] in seen:
                      raise ValueError(f"Duplicate translation page: {unit['page']}")
                  seen.add(unit["page"])
                  edition["units"].append(unit)
          tasks = plan(inv,edition)
          selected = tasks[:10]
          pages = {task["page"] for task in selected}
          batch = {"source_sha256":inv["source_sha256"],"units":[u for u in inv["units"] if u["page"] in pages],"tasks":selected,"remaining":len(tasks)}
          (folder/"first-batch.json").write_text(json.dumps(batch,ensure_ascii=False,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bilingual-translation-work
          path: build/translation/
          retention-days: 14
