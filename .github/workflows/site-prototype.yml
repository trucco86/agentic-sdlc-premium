name: Learning site prototype checks
on:
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/site-prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: read
jobs:
  prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate local prototype and governance
        run: python -m unittest discover -s site/tests -v
      - name: Enforce editorial content gate
        run: python site/scripts/validate_content.py
      - name: Validate source and independent review evidence
        run: python site/scripts/review_evidence.py
      - name: Generate editorial decision report
        run: python site/scripts/editorial_report.py --output site/editorial-report.json
      - name: Audit actual GitHub PR reviews (read only)
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python site/scripts/github_review_audit.py --repository "${{ github.repository }}" --pr "${{ github.event.pull_request.number }}" --output site/github-review-audit.json
      - name: Consolidate safe release decision
        run: python site/scripts/release_decision.py --editorial site/editorial-report.json --github site/github-review-audit.json --output site/release-decision.json
      - name: Render private human review summary
        run: python site/scripts/editorial_summary.py --editorial site/editorial-report.json --github site/github-review-audit.json --release site/release-decision.json --output site/editorial-summary.md
      - name: Upload private editorial report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: private-site-editorial-report
          path: |
            site/editorial-report.json
            site/github-review-audit.json
            site/release-decision.json\n            site/editorial-summary.md
          if-no-files-found: warn
          retention-days: 7
